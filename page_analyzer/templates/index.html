<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор страниц</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'error' else 'danger' }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="bg-light p-4 p-md-5 rounded-4 shadow-sm">
                    <h1 class="text-center mb-3">Анализатор страниц</h1>
                    <p class="text-center text-muted mb-4">
                        Бесплатно проверяйте сайты на SEO-пригодность
                    </p>

                    <form action="{{ url_for('add_url') }}" method="POST" class="row g-2">
                        <div class="col-8">
                            <input
                                type="text"
                                name="url"
                                class="form-control form-control-lg"
                                placeholder="https://www.example.com"
                                required
                            >
                        </div>
                        <div class="col-4">
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Проверить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
